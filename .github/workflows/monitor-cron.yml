# ==============================================================================
# HawkOffer External Scheduled Monitoring Trigger
# ==============================================================================
# Triggers the centralized multi-tenant monitoring pipeline on the deployed
# backend service via authenticated POST /api/v1/internal/cron/monitor.
#
# Requirements in GitHub Repository Settings -> Secrets and variables -> Actions:
#   - Repository Secret:   CRON_SECRET  (Matches backend HAWKOFFER_CRON_SECRET)
#   - Variable or Secret:  API_BASE_URL (e.g. https://hawkoffer-backend.onrender.com)
# ==============================================================================

name: HawkOffer Scheduled Monitoring

on:
  schedule:
    # Run every 30 minutes to discover new job postings centrally
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual monitoring trigger"
        required: false
        default: "Manual on-demand trigger"

concurrency:
  group: monitoring-cron
  cancel-in-progress: false

jobs:
  trigger-monitor:
    name: Trigger Centralized Monitoring Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Monitoring Cycle via Internal API
        env:
          TARGET_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          # Ensure secrets are masked in GitHub Actions log output
          if [ -n "$CRON_SECRET" ]; then
            echo "::add-mask::$CRON_SECRET"
          fi

          # 1. Validate configuration prerequisites
          if [ -z "$TARGET_BASE_URL" ]; then
            echo "::error::API_BASE_URL variable or secret is not configured in this repository."
            echo "Please navigate to Settings -> Secrets and variables -> Actions and set API_BASE_URL."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in this repository."
            echo "Please navigate to Settings -> Secrets and variables -> Actions and set CRON_SECRET."
            exit 1
          fi

          # Strip trailing slashes and /api/v1 prefix if provided
          CLEAN_BASE_URL="${TARGET_BASE_URL%/}"
          CLEAN_BASE_URL="${CLEAN_BASE_URL%/api/v1}"
          MONITOR_ENDPOINT="${CLEAN_BASE_URL}/api/v1/internal/cron/monitor"

          echo "[HawkOffer Cron] Initiating centralized monitoring trigger..."
          echo "[HawkOffer Cron] Target Endpoint: ${CLEAN_BASE_URL}/api/v1/internal/cron/monitor"
          echo "[HawkOffer Cron] Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # 2. Execute HTTP POST with strict timeout and retry behavior
          # --fail-with-body prints response body even on 4xx/5xx responses
          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl \
            --request POST \
            --url "$MONITOR_ENDPOINT" \
            --header "X-Cron-Secret: $CRON_SECRET" \
            --header "Accept: application/json" \
            --header "User-Agent: HawkOffer-Cron/1.0 (GitHubActions)" \
            --silent \
            --show-error \
            --max-time 180 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            --write-out "%{http_code}" \
            --output "$RESPONSE_FILE" \
            || echo "CURL_ERROR")

          if [ "$HTTP_STATUS" = "CURL_ERROR" ]; then
            echo "::error::Network or connection timeout failed while contacting $MONITOR_ENDPOINT."
            exit 1
          fi

          echo "[HawkOffer Cron] Response HTTP Status: $HTTP_STATUS"
          echo "[HawkOffer Cron] Response Payload:"
          cat "$RESPONSE_FILE"
          echo ""

          # 3. Assert successful HTTP status
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "::notice::Centralized monitoring trigger succeeded with HTTP $HTTP_STATUS."
            rm -f "$RESPONSE_FILE"
            exit 0
          elif [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 403 ]; then
            echo "::error::Authentication failed ($HTTP_STATUS). CRON_SECRET does not match backend configuration."
            rm -f "$RESPONSE_FILE"
            exit 1
          else
            echo "::error::Monitoring pipeline returned HTTP $HTTP_STATUS error."
            rm -f "$RESPONSE_FILE"
            exit 1
          fi
